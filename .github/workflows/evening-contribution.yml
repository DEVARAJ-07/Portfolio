name: 3. Evening Contribution (05:30 PM IST)

on:
  schedule:
    # 05:30 PM IST = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evening-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git identity
        run: |
          git config --global user.name "DEVARAJ-07"
          git config --global user.email "devakrs07@gmail.com"

      - name: Run Evening Contribution Script
        run: |
          COMMIT_MSG=$(node scripts/daily-contribute.js --slot=evening)
          echo "Commit message: $COMMIT_MSG"
          git add .github/activity.log
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin main
